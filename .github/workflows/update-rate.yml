name: Actualizar cotización BCB

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: America/La_Paz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar tabla oficial diaria del BCB
        run: node scripts/fetch-rate.mjs
      - name: Guardar nueva cotización cuando cambie
        run: |
          git config user.name 'Ventry BCB updater'
          git config user.email 'noreply@users.noreply.github.com'
          git add rate.json
          git diff --cached --quiet || git commit -m 'Actualizar cotización BCB'
          git push
